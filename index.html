<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Money Radar</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eeec;--surface:#f7faf9;--ink:#12302a;--mute:#5b7069;--line:#c9d6d1;--accent:#0f6b58;--gold:#f0b429;--goldink:#3d2b00;--warn:#b4442f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b18;--surface:#152723;--ink:#e3efeb;--mute:#8fa8a0;--line:#26403a;--accent:#4fd1b0;--gold:#f0b429;--goldink:#2b1e00;--warn:#ff8a73}}
:root[data-theme="dark"]{--bg:#0e1b18;--surface:#152723;--ink:#e3efeb;--mute:#8fa8a0;--line:#26403a;--accent:#4fd1b0;--gold:#f0b429;--goldink:#2b1e00;--warn:#ff8a73}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:clamp(28px,5vw,44px);line-height:1;margin:0;font-weight:800;letter-spacing:-.03em}
.sub{color:var(--mute);margin:6px 0 0;font-size:14px}
.sample{background:var(--gold);color:var(--goldink);font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.theme-btn{background:none;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px}
.opp{background:var(--gold);color:var(--goldink);border-radius:14px 14px 14px 4px;padding:18px 20px;margin-bottom:18px}
.opp b.t{font-size:13px;font-weight:600;opacity:.8}
.opp h2{margin:4px 0 6px;font-size:22px;line-height:1.15;letter-spacing:-.02em}
.opp p{margin:0;font-family:Newsreader,Georgia,serif;font-size:17px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input[type=search]{flex:1 1 220px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.bar select{padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.bar label{font-size:14px;display:flex;gap:6px;align-items:center;color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.chip{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.chip small{opacity:.7;font-weight:400;margin-left:4px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.item{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c,var(--accent));border-radius:6px 14px 14px 6px;padding:14px 16px;margin-bottom:12px}
.item.read{opacity:.55}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);align-items:center}
.item h3{margin:4px 0 6px;font-size:18px;line-height:1.25;letter-spacing:-.01em;cursor:pointer}
.item p{margin:0 0 8px;font-family:Newsreader,Georgia,serif;font-size:16.5px;line-height:1.5}
.act{font-size:15.5px;border-top:1px dashed var(--line);padding-top:8px;margin-top:8px;display:none}
.item.open .act{display:block}
.act b{color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.row button{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:13px}
.row button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:12.5px}.ok{color:var(--accent);border-color:var(--accent)}.warn{color:var(--warn);border-color:var(--warn)}a{color:var(--accent)}.act ol,.opp ol{margin:6px 0 0;padding-left:22px}.act li{margin-bottom:4px}.opp li{margin-bottom:3px;font-size:16px}
.hype{display:inline-flex;gap:2px;align-items:center}
.hype i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.hype i.on{background:var(--warn)}
aside .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;position:sticky;top:12px}
aside h4{margin:0 0 10px;font-size:15px}
.tr{display:grid;grid-template-columns:90px 1fr 22px;gap:8px;align-items:center;font-size:13px;margin-bottom:6px}
.tr span.bar2{height:8px;border-radius:4px;background:var(--accent);display:block}
.empty{padding:30px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:12px}
@media(prefers-reduced-motion:no-preference){.opp{animation:in .5s ease-out}@keyframes in{from{transform:translateY(8px);opacity:0}}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div><h1>AI Money Radar</h1><p class="sub" id="today"></p></div>
<div style="display:flex;gap:8px;align-items:center"><span class="sample">Sample data</span><button class="theme-btn" id="tgl">Light / dark</button></div>
</header>

<p class="sub" style="font-size:15px;margin:-6px 0 14px">Daily AI news in plain English. When there is a way to earn from it, you get simple steps.</p>
<section class="opp" id="opp"></section>

<div class="bar">
<input type="search" id="q" placeholder="Search, e.g. phone, video, free" aria-label="Search">
<select id="src" aria-label="Source"></select>
<select id="rng" aria-label="Date range"><option value="1">Today</option><option value="7" selected>Past 7 days</option><option value="30">Past 30 days</option></select>
<label><input type="checkbox" id="nohype"> Hide sales pitches</label>
<label><input type="checkbox" id="saved"> Only my saved</label>
</div>
<div class="chips" id="chips" role="group" aria-label="Themes"></div>

<div class="grid">
<main id="list"></main>
<aside><div class="box"><h4>What people are talking about</h4><div id="trends"></div><p class="sub" style="font-size:12.5px">Topics that keep coming back are worth more attention than a one-day headline.</p></div></aside>
</div>
</div>

<script>
var THEMES=[
{id:"money",name:"Ways to earn",c:"#0f6b58"},
{id:"tools",name:"Tools to try",c:"#3b6fd4"},
{id:"saas",name:"Software ideas",c:"#8a52c8"},
{id:"agency",name:"Services to sell",c:"#c26a1b"},
{id:"mkt",name:"Getting customers",c:"#c23a73"},
{id:"world",name:"News that affects you",c:"#5b7069"}];
// Placeholder items. The daily collector will replace these with real news.json
var DATA=[
{id:1,d:0,th:"money",src:"Indie Hackers",hy:0,lv:"Medium",pay:"Medium",tags:["small business","one problem"],t:"One person makes $8,000 a month helping freelancers send invoices",s:"Sample story. Instead of building something for everyone, this person made one small tool for one type of worker.",st:["Pick a job you know well, like photographers or tutors.","Ask five of them: what boring paperwork do you hate most?","Make a simple tool or template that fixes only that, and charge a small monthly fee."]},
{id:2,d:0,th:"tools",src:"Hacker News",hy:0,lv:"Easy",pay:"Medium",tags:["free tools","AI helper"],t:"A free tool lets you build your own AI helper with almost no setup",s:"Sample story. You can now describe a task in plain words and get a helper that does it for you.",st:["Pick one boring task you do every week, like answering the same emails.","Try the free tool and ask it to do that task for you.","If it works, offer the same to a small business for a monthly fee."]},
{id:3,d:0,th:"mkt",src:"The Rundown AI",hy:2,lv:"Easy",pay:"Low",tags:["video","risky"],t:"Channels that repost other people's video clips are losing views",s:"Sample story. Apps are cracking down on copied videos, so this way of earning is getting riskier.",st:["Don't put all your effort into one app you don't control.","If you still try it, only use clips from creators who gave you written permission.","Collect emails or followers you can reach outside the app."]},
{id:4,d:1,th:"agency",src:"r/Entrepreneur",hy:0,lv:"Medium",pay:"High",tags:["small business","phone"],t:"Business owners pay monthly for an AI that answers their missed phone calls",s:"Sample story. Shops lose customers when nobody picks up. An AI that answers and books appointments fixes that.",st:["Pick one type of local shop, like dentists or hair salons.","Ask the owner how many calls they miss each week.","Set up a phone-answering AI tool for them and charge a monthly fee."]},
{id:5,d:1,th:"world",src:"TLDR AI",hy:0,lv:"Easy",pay:"Keeps you safe",tags:["rules"],t:"The EU wants AI-made content to be labeled",s:"Sample story. If you share AI-made pictures, text or video with people in Europe, you may need to say so.",st:["Add a short note like 'made with AI help' to AI-made content.","Check the rules on the official EU website once a year."]},
{id:6,d:2,th:"saas",src:"Starter Story",hy:0,lv:"Medium",pay:"Medium",tags:["one problem","online group"],t:"A small software business grew by posting in just one Facebook group",s:"Sample story. No ads. The founder went where future customers already complain about their problems.",st:["Find one online group where your future customers complain.","Read it for a week and write down the most repeated complaint.","Offer a simple fix and share it with the group, without spamming."]},
{id:7,d:2,th:"money",src:"YouTube",hy:3,lv:"Easy",pay:"Low",tags:["scams","courses"],t:"Videos promising '$10,000 a month with one trick' are everywhere again",s:"Sample story. These almost always lead to a paid course. They rarely show real proof of earnings.",st:["Don't pay for it.","Ask: do they show real payout pages, not just screenshots?","Follow people who share honest numbers, for example on Indie Hackers."]},
{id:8,d:3,th:"tools",src:"Product Hunt",hy:1,lv:"Medium",pay:"Medium",tags:["phone","free tools"],t:"You can now build a talking phone assistant without writing code",s:"Sample story. Drag-and-drop tools make it easy to build an assistant that talks to callers.",st:["Compare two tools and check the price per minute of talking.","Build a simple one that answers three common questions.","Test it with a friend who owns a small business."]},
{id:9,d:3,th:"saas",src:"Acquire.com",hy:0,lv:"Hard",pay:"High",tags:["selling a business"],t:"Small online businesses sell for about 3 to 4 times a year's profit",s:"Sample story. A business making $1,000 profit a month could sell for roughly $36,000 to $48,000.",st:["Build or buy something small that earns steady monthly money.","Keep customers happy so they don't cancel.","After a year or two, list it for sale on a site like Acquire.com."]},
{id:10,d:4,th:"agency",src:"Latent Space",hy:0,lv:"Medium",pay:"Medium",tags:["small business","fixing"],t:"Most AI setups break after two months, so businesses pay for fixing them",s:"Sample story. Companies don't notice when their AI quietly stops working. Reliability is something they will pay for.",st:["After you set up an AI tool for someone, offer a monthly check-up.","Set up an alert that tells you if it stops working.","Charge a small monthly fee for the check-up."]},
{id:11,d:5,th:"mkt",src:"r/SaaS",hy:1,lv:"Easy",pay:"Medium",tags:["google","writing"],t:"Copy-paste AI articles are losing on Google, original ones are winning",s:"Sample story. Pages with your own photos, numbers or real experience keep showing up in search.",st:["Pick a topic you really know.","Write one article with your own photos or real numbers.","Share it in the places your customers read."]},
{id:12,d:6,th:"world",src:"Import AI",hy:0,lv:"Easy",pay:"High",tags:["small business","jobs"],t:"Small companies want someone to set up AI for them, explained in plain language",s:"Sample story. Owners don't want a lecture on AI. They want someone to make it work.",st:["Learn one tool well, like an AI email helper.","Offer to set it up for one small business, explained in plain words.","Charge for the result, like 'saves you 5 hours a week'."]}];
var OPP={t:"Pick one boring job and fix one annoying task",s:"Sample pick. Most winners in this list did not build something fancy. They solved one small, boring problem for one type of person.",st:["Choose a job or business you know a bit about.","Ask five people in it what task annoys them most.","Fix that one task with a free AI tool, then ask if they would pay for it."]};

var $=function(i){return document.getElementById(i)};
var store={get:function(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
var st={theme:"all",saved:store.get("amr-saved",{}),read:store.get("amr-read",{}),open:{}};
var T={};THEMES.forEach(function(x){T[x.id]=x});
var now=new Date();
$("today").textContent=now.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})+" · refreshed each morning";
$("opp").innerHTML='<b class="t">Idea of the day</b><h2>'+OPP.t+'</h2><p>'+OPP.s+'</p><ol>'+OPP.st.map(function(x){return"<li>"+x+"</li>"}).join("")+"</ol>";

function buildSrc(){var srcs=Array.from(new Set(DATA.map(function(x){return x.src}))).sort();
$("src").innerHTML='<option value="">All sources</option>'+srcs.map(function(s){return'<option>'+s+'</option>'}).join("")}
buildSrc();
function showOpp(){$("opp").innerHTML='<b class="t">Idea of the day</b><h2>'+OPP.t+'</h2><p>'+OPP.s+'</p><ol>'+OPP.st.map(function(x){return"<li>"+x+"</li>"}).join("")+"</ol>"}
fetch("news.json?"+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
 if(!j.items||!j.items.length)return;
 var today=new Date().toISOString().slice(0,10);
 DATA=j.items.map(function(x){x.d=Math.max(0,Math.round((new Date(today)-new Date(x.date))/864e5));x.tags=x.tags||[];x.st=x.st||[];return x});
 if(j.opp&&j.opp.st)OPP=j.opp;
 var b=document.querySelector(".sample");if(b)b.textContent="Updated "+new Date(j.updated).toLocaleDateString();
 buildSrc();showOpp();render()}).catch(function(){});

function match(x){
 var q=$("q").value.trim().toLowerCase(),s=$("src").value,r=+$("rng").value;
 if(st.theme!=="all"&&x.th!==st.theme)return false;
 if(s&&x.src!==s)return false;
 if(x.d>=r)return false;
 if($("nohype").checked&&x.hy>=2)return false;
 if($("saved").checked&&!st.saved[x.id])return false;
 if(q&&(x.t+" "+x.s+" "+x.tags.join(" ")+" "+x.st.join(" ")).toLowerCase().indexOf(q)<0)return false;
 return true}
function trust(n){return n===0?'<span class="pill ok">Looks real</span>':n===1?'<span class="pill">Check before trusting</span>':'<span class="pill warn">Careful: likely a sales pitch</span>'}
function day(d){return d===0?"Today":d===1?"Yesterday":d+" days ago"}
function render(){
 var base=DATA.filter(function(x){var t=st.theme;st.theme="all";var m=match(x);st.theme=t;return m});
 $("chips").innerHTML=[{id:"all",name:"All"}].concat(THEMES).map(function(t){
  var n=t.id==="all"?base.length:base.filter(function(x){return x.th===t.id}).length;
  return'<button class="chip" data-t="'+t.id+'" aria-pressed="'+(st.theme===t.id)+'">'+t.name+'<small>'+n+'</small></button>'}).join("");
 var items=DATA.filter(match);
 $("list").innerHTML=items.length?items.map(function(x){
  var th=T[x.th];
  return'<article class="item'+(st.read[x.id]?" read":"")+(st.open[x.id]?" open":"")+'" style="--c:'+th.c+'">'+
  '<div class="meta"><b style="color:'+th.c+'">'+th.name+'</b><span>'+x.src+'</span><span>'+day(x.d)+'</span>'+trust(x.hy)+'</div>'+
  '<h3 data-o="'+x.id+'" tabindex="0" role="button">'+x.t+'</h3><p>'+x.s+(x.url?' <a href="'+x.url+'" target="_blank" rel="noopener noreferrer">Read the original</a>':'')+'</p>'+
  '<div class="meta"><span class="pill">How hard: '+x.lv+'</span><span class="pill">Earning potential: '+x.pay+'</span></div>'+
  '<div class="act"><b>How to do it, step by step</b><ol>'+x.st.map(function(s){return"<li>"+s+"</li>"}).join("")+'</ol></div>'+
  '<div class="row"><button data-o="'+x.id+'">'+(st.open[x.id]?"Hide steps":"Show steps")+'</button><button data-s="'+x.id+'" aria-pressed="'+!!st.saved[x.id]+'">'+(st.saved[x.id]?"Saved":"Save")+'</button><button data-r="'+x.id+'" aria-pressed="'+!!st.read[x.id]+'">'+(st.read[x.id]?"Read":"Mark as read")+'</button></div></article>'}).join(""):
  '<div class="empty">Nothing matches. Try a longer date range or clear the search box.</div>';
 var tc={};items.forEach(function(x){x.tags.forEach(function(g){tc[g]=(tc[g]||0)+1})});
 var top=Object.keys(tc).sort(function(a,b){return tc[b]-tc[a]}).slice(0,7),mx=tc[top[0]]||1;
 $("trends").innerHTML=top.map(function(g){return'<div class="tr"><span>'+g+'</span><span class="bar2" style="width:'+Math.round(tc[g]/mx*100)+'%"></span><span>'+tc[g]+'</span></div>'}).join("")||'<p class="sub">Nothing yet.</p>'}
document.addEventListener("click",function(e){
 var b=e.target.closest("[data-t],[data-s],[data-r],[data-o]");if(!b)return;
 if(b.dataset.t){st.theme=b.dataset.t}
 else if(b.dataset.s){var i=b.dataset.s;st.saved[i]=!st.saved[i];store.set("amr-saved",st.saved)}
 else if(b.dataset.r){var j=b.dataset.r;st.read[j]=!st.read[j];store.set("amr-read",st.read)}
 else if(b.dataset.o){var k=b.dataset.o;st.open[k]=!st.open[k]}
 render()});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.matches("h3[data-o]")){st.open[e.target.dataset.o]=!st.open[e.target.dataset.o];render()}});
["q","src","rng","nohype","saved"].forEach(function(i){$(i).addEventListener("input",render)});
$("tgl").onclick=function(){var r=document.documentElement,d=r.getAttribute("data-theme");
 var dark=d?d==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.setAttribute("data-theme",dark?"light":"dark")};
render();
</script>
</body>
</html>
