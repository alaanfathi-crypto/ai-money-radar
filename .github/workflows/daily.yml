name: Daily AI Money Radar
on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC every day. Change the hour if you like.
  workflow_dispatch:       # lets you press "Run workflow" manually
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and summarize
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python collect.py
      - name: Save news.json
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "Daily update"
          git push
